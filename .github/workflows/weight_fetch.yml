name: Weight Fetch

# 只负责「取数」:把体脂秤的数据归一化后写成 src/static/weights.json 并提交。
#
# 为什么和 run_data_sync.yml 拆开:
#   run_page/data.db 是 SQLite 二进制文件,两个 workflow 同时改它无法合并;
#   拆开之后本 workflow 只写一个 JSON 文件,职责单一,不会和主管线抢数据库。
#   主管线再用 `weight_sync.py --local` 把 weights.json 里的体重匹配到活动。
#
# 没有配置数据源时(例如别人 fork 了本仓库),脚本会把 weights.json 写成 [],
# 站点不会显示任何体重相关的列与图表,对方不需要改任何东西。

on:
  workflow_dispatch:
  schedule:
    - cron: '00 22 * * *' # 北京时间 06:00
  push:
    branches:
      - master
    paths:
      - run_page/weight_sync.py
      - run_page/weight_sources/**
      - .github/workflows/weight_fetch.yml

# 与 run_data_sync.yml 共用同一个并发组:两边都要向仓库提交,
# 串行执行可以避免 push 冲突,也避免两个 workflow 同时碰 data.db。
concurrency:
  group: data-sync-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch weight data
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 安装 UV
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"
          enable-cache: true

      - name: 设置 Python
        run: uv python install 3.13

      - name: 安装依赖
        run: |
          if [ -f "pyproject.toml" ]; then
            uv sync --frozen
          elif [ -f "requirements.txt" ]; then
            uv pip install -r requirements.txt
          else
            echo "未找到依赖文件"
          fi

      # WEIGHT_SOURCE 来自仓库变量(GitHub Variables)。Variables 不会被 fork 继承,
      # 所以 fork 本仓库的人这里拿到的是空字符串 -> 脚本安全跳过,
      # 把 weights.json 写成 [] 并提交,站点不会显示任何体重相关信息。
      #
      # 安全边界(重要):本文件刻意只用 schedule / workflow_dispatch 触发。
      # 绝对不要改成 pull_request_target —— 本仓库是公开且允许 fork 的,
      # 那样会把下面的 secret 暴露给任意 fork 提交的 PR。
      - name: Fetch weight data
        env:
          WEIGHT_SOURCE: ${{ vars.WEIGHT_SOURCE }}
          WEIGHT_SOURCE_URL: ${{ vars.WEIGHT_SOURCE_URL }}
          YUNMAI_ACCOUNT: ${{ secrets.YUNMAI_ACCOUNT }}
          YUNMAI_PASSWORD: ${{ secrets.YUNMAI_PASSWORD }}
          YUNMAI_RSA_PUBLIC_KEY: ${{ secrets.YUNMAI_RSA_PUBLIC_KEY }}
          YUNMAI_API_SECRET: ${{ secrets.YUNMAI_API_SECRET }}
          WEIGHT_TOLERANCE_DAYS: '3'
        run: uv run python run_page/weight_sync.py --fetch-only

      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/static/weights.json
          git commit -m 'Update weight data' || echo "nothing to commit"
          git push || echo "nothing to push"
